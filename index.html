<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest-Clone</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="shortcut icon" href="./logo.png" type="image/x-icon"><link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>
    <aside class="sidebar">
        <nav>
              <img src="./logo.png" alt="Pinterest">
            <a href="#"><i class="ri-home-smile-2-fill"></i></a>
            <a href="#"><i class="ri-compass-fill"></i></a>
            <a href="#"><i id="add" class="ri-add-large-line"></i></a>
            <a href="#"><i class="ri-notification-3-line"></i></a>
            <a href="#"><i class="ri-message-3-line"></i></a>
        </nav>
        <i class="ri-settings-2-line"></i>
    </aside>
    <main>
    <header>
        <div class="search-nav">
            <i class="ri-search-line"></i>
            <div class="search-navright">
                <i class="ri-camera-4-line"></i>
                <i class="ri-mic-2-line"></i>
            </div>
        </div>
        <input id="search" type="search" placeholder="Search">
                <div class="suggestion" hidden>
            <h3></h3>
        </div>
    </header>
    <div class="preview">
            <img id="main-img" src="https://i.pinimg.com/1200x/09/f8/36/09f836d6812b22fe7a3f3a5d213ea456.jpg" alt="">
            <div class="info">
                 <div class="preview-icons">
                 <i class="ri-heart-2-line"></i>
        <i class="ri-save-line"></i>
        <i class="ri-share-2-line"></i>
        <i class="ri-more-fill"></i>
        </div>
                <div class="title-info">
                    <img id="second-image" src="https://i.pinimg.com/1200x/09/f8/36/09f836d6812b22fe7a3f3a5d213ea456.jpg" alt="">
                    <h2 id="title">berserk</h2>
                </div>
                <h5 id="description">description......</h5>
            </div>
        </div>
    <div class="top">
        <h3>All</h3>
    </div>
    <div class="container">
    </div>

</div>
    </main>
    <script src="script.js"></script>
</body>
</html>
